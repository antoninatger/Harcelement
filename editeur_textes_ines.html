<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur Textes - Inès</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;font-size:14px}
.bar{background:#1e293b;border-bottom:1px solid #334155;padding:10px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.bar-title{font-weight:700;font-size:15px;color:#f1f5f9;margin-right:auto}
.btn{padding:7px 15px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:opacity .15s;line-height:1}
.btn:hover{opacity:.8}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-load{background:#334155;color:#e2e8f0}
.btn-export{background:#3b82f6;color:#fff}
.fname{font-size:12px;color:#64748b;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layout{display:flex;height:calc(100vh - 45px)}
.sidebar{width:168px;background:#1e293b;border-right:1px solid #334155;padding:8px;flex-shrink:0;overflow-y:auto}
.nav{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;border:none;cursor:pointer;font-size:13px;color:#94a3b8;background:transparent;margin-bottom:3px;transition:all .15s}
.nav:hover{background:#334155;color:#e2e8f0}
.nav.on{background:#1d4ed8;color:#fff}
.pane{flex:1;overflow-y:auto;padding:20px 24px}
.empty{display:flex;align-items:center;justify-content:center;height:100%;text-align:center}
.empty p{color:#475569;font-size:15px;line-height:2}
.empty code{background:#1e293b;padding:2px 7px;border-radius:4px;font-size:13px;color:#94a3b8}
.sec-title{font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #334155}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:14px;margin-bottom:10px}
.card-head{font-size:11px;font-weight:600;text-transform:uppercase;color:#64748b;letter-spacing:.6px;margin-bottom:10px}
.field{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.field:last-child{margin-bottom:0}
.fl{font-size:12px;color:#64748b;min-width:110px;padding-top:7px;flex-shrink:0}
input.fi,textarea.fi,select.fi{flex:1;background:#0f172a;border:1px solid #334155;border-radius:5px;color:#e2e8f0;padding:6px 9px;font-size:13px;font-family:inherit;resize:none}
input.fi:focus,textarea.fi:focus,select.fi:focus{outline:none;border-color:#3b82f6}
textarea.fi{overflow:hidden}
.msg-list{margin-bottom:6px}
.msg-row{display:flex;gap:7px;align-items:flex-start;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:8px;margin-bottom:5px}
.msg-row:focus-within{border-color:#3b82f6}
.msg-ta{flex:1;background:transparent;border:none;color:#e2e8f0;padding:3px 5px;font-size:13px;font-family:inherit;resize:none;min-height:32px;outline:none}
select.mtype{background:#1e293b;border:1px solid #334155;border-radius:4px;color:#e2e8f0;padding:4px 6px;font-size:12px;flex-shrink:0}
.rmv{background:#2d1a1a;border:1px solid #4a1a1a;border-radius:4px;color:#f87171;padding:3px 9px;cursor:pointer;font-size:14px;flex-shrink:0;line-height:1}
.rmv:hover{background:#3d2020}
.add-btn{display:block;width:100%;background:#0f172a;border:1px dashed #334155;border-radius:6px;padding:7px 12px;color:#64748b;font-size:12px;cursor:pointer;margin-top:4px;text-align:center}
.add-btn:hover{border-color:#3b82f6;color:#60a5fa}
.choice-row{display:flex;gap:7px;align-items:flex-start;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:8px;margin-bottom:5px}
.choice-row:focus-within{border-color:#3b82f6}
input.clbl{width:34px;background:#1e293b;border:1px solid #334155;border-radius:4px;color:#60a5fa;padding:5px 6px;font-size:12px;font-weight:700;text-align:center;flex-shrink:0}
select.ceff{width:68px;background:#1e293b;border:1px solid #334155;border-radius:4px;color:#e2e8f0;padding:4px 6px;font-size:12px;flex-shrink:0}
.step{background:#1e293b;border:1px solid #334155;border-radius:8px;margin-bottom:10px;overflow:hidden}
.step-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;transition:background .15s}
.step-hd:hover{background:#263448}
.step-num{background:#1d4ed8;color:#fff;border-radius:4px;padding:2px 9px;font-size:11px;font-weight:700;flex-shrink:0}
.step-preview{font-size:12px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-style:italic}
.step-arrow{font-size:11px;color:#475569;flex-shrink:0}
.step-body{padding:14px;border-top:1px solid #334155;display:none}
.step-body.open{display:block}
.sub{font-size:11px;font-weight:600;text-transform:uppercase;color:#64748b;letter-spacing:.5px;margin-bottom:8px;margin-top:12px}
.sub:first-child{margin-top:0}
.checkbox-row{display:flex;align-items:center;gap:6px;flex-shrink:0}
.checkbox-row label{font-size:10px;color:#475569}
.checkbox-row input{width:14px;height:14px;cursor:pointer;accent-color:#3b82f6}
</style>
</head>
<body>

<div class="bar">
  <span class="bar-title">✏️ Éditeur Textes - Inès</span>
  <label class="btn btn-load" for="fi">📂 Charger .js</label>
  <input type="file" id="fi" accept=".js" style="display:none">
  <span class="fname" id="fname">aucun fichier chargé</span>
  <button class="btn btn-export" id="bexp" disabled>💾 Exporter .js</button>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <button class="nav on" data-t="general">Général</button>
    <button class="nav" data-t="ouverture">Ouverture</button>
    <button class="nav" data-t="scenario">Scénario G</button>
    <button class="nav" data-t="crisis">Crise</button>
    <button class="nav" data-t="revelations">Révélations</button>
    <button class="nav" data-t="fins">Fins</button>
  </nav>
  <main class="pane" id="pane">
    <div class="empty" id="empty">
      <p>Chargez un fichier <code>*_textes.js</code><br>pour commencer l'édition.</p>
    </div>
    <div id="editor" style="display:none"></div>
  </main>
</div>

<script>
let T = null;
let curTab = 'general';
let loadedFname = '';

// ── File load ──────────────────────────────────────────────────────────────
document.getElementById('fi').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  loadedFname = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const content = ev.target.result.replace(/^﻿/, ''); // strip UTF-8 BOM
      const fn = new Function(content + '\nreturn typeof TEXTES !== "undefined" ? TEXTES : null;');
      T = fn();
      if (!T) throw new Error('Variable TEXTES introuvable - vérifie que le fichier commence par : var TEXTES = {…}');
      document.getElementById('fname').textContent = loadedFname;
      document.getElementById('bexp').disabled = false;
      document.getElementById('empty').style.display = 'none';
      document.getElementById('editor').style.display = 'block';
      showTab(curTab);
    } catch (err) {
      alert('Erreur lors du chargement de « ' + loadedFname + ' » :\n\n' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
  this.value = '';
});

// ── Export ─────────────────────────────────────────────────────────────────
document.getElementById('bexp').addEventListener('click', () => {
  const js = 'var TEXTES = ' + JSON.stringify(T, null, 2) + ';\n';
  const blob = new Blob([js], { type: 'text/javascript;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = loadedFname || 'textes.js';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ── Tabs ───────────────────────────────────────────────────────────────────
document.getElementById('sidebar').addEventListener('click', e => {
  const btn = e.target.closest('.nav');
  if (!btn || !T) return;
  document.querySelectorAll('.nav').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  curTab = btn.dataset.t;
  showTab(curTab);
});

function showTab(t) {
  const ed = document.getElementById('editor');
  ed.innerHTML = '';
  const map = { general: renderGeneral, ouverture: renderOuverture, scenario: renderScenario, crisis: renderCrisis, revelations: renderRevelations, fins: renderFins };
  if (map[t]) ed.appendChild(map[t]());
}

// ── DOM helpers ────────────────────────────────────────────────────────────
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function mkInput(val, cls, cb) {
  const i = document.createElement('input');
  i.className = 'fi ' + (cls || '');
  i.value = val || '';
  i.addEventListener('input', () => cb(i.value));
  return i;
}

function mkTextarea(val, cls, cb) {
  const t = document.createElement('textarea');
  t.className = 'fi ' + (cls || '');
  t.value = val || '';
  autoH(t);
  t.addEventListener('input', () => { autoH(t); cb(t.value); });
  return t;
}

function mkSelect(val, opts, cls, cb) {
  const s = document.createElement('select');
  s.className = cls || '';
  opts.forEach(([v, lbl]) => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = lbl;
    if (String(v) === String(val)) o.selected = true;
    s.appendChild(o);
  });
  s.addEventListener('change', () => cb(s.value));
  return s;
}

function autoH(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function field(label, inputEl) {
  const row = el('div', 'field');
  row.appendChild(el('span', 'fl', label));
  row.appendChild(inputEl);
  return row;
}

function card(title, ...children) {
  const c = el('div', 'card');
  if (title) c.appendChild(el('div', 'card-head', title));
  children.forEach(ch => ch && c.appendChild(ch));
  return c;
}

function rmvBtn(cb) {
  const b = el('button', 'rmv', '×');
  b.type = 'button';
  b.addEventListener('click', cb);
  return b;
}

function addBtn(label, cb) {
  const b = el('button', 'add-btn', label);
  b.type = 'button';
  b.addEventListener('click', cb);
  return b;
}

const MSG_TYPES = [
  ['s',  '→ Envoyé (s)'],
  ['r',  '← Reçu (r)'],
  ['sy', '● Système (sy)'],
  ['cr', '⚠ Crise (cr)'],
  ['ed', '📋 Info (ed)'],
];

const EFF_OPTS = [
  ['-2', '−2 ◼◼'],
  ['-1', '−1 ◼'],
  ['0',  ' 0'],
  ['1',  '+1 ◼'],
  ['2',  '+2 ◼◼'],
];

// ── Message list (array of {t, type}) ─────────────────────────────────────
function msgList(arr) {
  const wrap = el('div', 'msg-list');
  const render = () => {
    wrap.innerHTML = '';
    arr.forEach((msg, i) => {
      const row = el('div', 'msg-row');
      const ta = document.createElement('textarea');
      ta.className = 'msg-ta';
      ta.value = msg.t || '';
      ta.placeholder = 'Texte…';
      autoH(ta);
      ta.addEventListener('input', () => { autoH(ta); arr[i].t = ta.value; });
      const ts = mkSelect(msg.type, MSG_TYPES, 'mtype', v => { arr[i].type = v; });
      const rm = rmvBtn(() => { arr.splice(i, 1); render(); });
      row.appendChild(ta);
      row.appendChild(ts);
      row.appendChild(rm);
      wrap.appendChild(row);
    });
    wrap.appendChild(addBtn('+ Ajouter un message', () => {
      arr.push({ t: '', type: 's' });
      render();
      wrap.querySelectorAll('.msg-row textarea').forEach((ta, idx, all) => {
        if (idx === all.length - 1) ta.focus();
      });
    }));
  };
  render();
  return wrap;
}

// ── Intro list (array of strings) ─────────────────────────────────────────
function introList(arr) {
  const wrap = el('div', 'msg-list');
  const render = () => {
    wrap.innerHTML = '';
    arr.forEach((str, i) => {
      const row = el('div', 'msg-row');
      const ta = document.createElement('textarea');
      ta.className = 'msg-ta';
      ta.value = str || '';
      ta.placeholder = 'Message d\'Inès…';
      autoH(ta);
      ta.addEventListener('input', () => { autoH(ta); arr[i] = ta.value; });
      row.appendChild(ta);
      row.appendChild(rmvBtn(() => { arr.splice(i, 1); render(); }));
      wrap.appendChild(row);
    });
    wrap.appendChild(addBtn('+ Ajouter une ligne', () => {
      arr.push('');
      render();
    }));
  };
  render();
  return wrap;
}

// ── Choices list (array of {l, t, e}) ─────────────────────────────────────
function choiceList(arr) {
  const wrap = el('div', 'msg-list');
  const render = () => {
    wrap.innerHTML = '';
    arr.forEach((c, i) => {
      const row = el('div', 'choice-row');
      const lbl = document.createElement('input');
      lbl.className = 'clbl';
      lbl.value = c.l || '';
      lbl.maxLength = 1;
      lbl.placeholder = 'A';
      lbl.addEventListener('input', () => { arr[i].l = lbl.value.toUpperCase(); lbl.value = lbl.value.toUpperCase(); });
      const ta = document.createElement('textarea');
      ta.className = 'msg-ta';
      ta.value = c.t || '';
      ta.placeholder = 'Texte du choix…';
      autoH(ta);
      ta.addEventListener('input', () => { autoH(ta); arr[i].t = ta.value; });
      const eff = mkSelect(c.e, EFF_OPTS, 'ceff', v => { arr[i].e = parseInt(v); });
      row.appendChild(lbl);
      row.appendChild(ta);
      row.appendChild(eff);
      row.appendChild(rmvBtn(() => { arr.splice(i, 1); render(); }));
      wrap.appendChild(row);
    });
    wrap.appendChild(addBtn('+ Ajouter un choix', () => {
      arr.push({ l: String.fromCharCode(65 + arr.length), t: '', e: 0 });
      render();
    }));
  };
  render();
  return wrap;
}

// ── Dialogue list (array of {who, t, gap?}) ───────────────────────────────
function dialogueList(arr) {
  const wrap = el('div', 'msg-list');
  const render = () => {
    wrap.innerHTML = '';
    arr.forEach((line, i) => {
      const row = el('div', 'msg-row');
      const ws = mkSelect(line.who, [['Inès','Inès'],['Léo','Léo']], 'mtype', v => { arr[i].who = v; });
      const ta = document.createElement('textarea');
      ta.className = 'msg-ta';
      ta.value = line.t || '';
      autoH(ta);
      ta.addEventListener('input', () => { autoH(ta); arr[i].t = ta.value; });
      const gc = el('div', 'checkbox-row');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!line.gap;
      cb.addEventListener('change', () => { if (cb.checked) arr[i].gap = true; else delete arr[i].gap; });
      gc.appendChild(cb);
      gc.appendChild(el('label', '', 'gap'));
      row.appendChild(ws);
      row.appendChild(ta);
      row.appendChild(gc);
      row.appendChild(rmvBtn(() => { arr.splice(i, 1); render(); }));
      wrap.appendChild(row);
    });
    wrap.appendChild(addBtn('+ Ajouter une ligne', () => {
      arr.push({ who: 'Inès', t: '' });
      render();
    }));
  };
  render();
  return wrap;
}

// ── IG card fields ─────────────────────────────────────────────────────────
function igFields(ig) {
  const wrap = el('div');
  wrap.appendChild(field('Label', mkInput(ig.label, '', v => ig.label = v)));
  wrap.appendChild(field('Label compte', mkInput(ig.compteLabel, '', v => ig.compteLabel = v)));
  wrap.appendChild(field('Compte', mkInput(ig.compte, '', v => ig.compte = v)));
  wrap.appendChild(field('Label mdp', mkInput(ig.mdpLabel, '', v => ig.mdpLabel = v)));
  wrap.appendChild(field('Mot de passe', mkInput(ig.mdp, '', v => ig.mdp = v)));
  wrap.appendChild(field('Avertissement', mkInput(ig.warn, '', v => ig.warn = v)));
  return wrap;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION: Général
// ═══════════════════════════════════════════════════════════════════════════
function renderGeneral() {
  const wrap = el('div');
  wrap.appendChild(el('div', 'sec-title', 'Général'));

  const co = T.contact;
  wrap.appendChild(card('Contact',
    field('Nom', mkInput(co.name, '', v => co.name = v)),
    field('Avatar (initiales)', mkInput(co.avatar, '', v => co.avatar = v)),
    field('Statut en ligne', mkInput(co.statusOnline, '', v => co.statusOnline = v)),
    field('Statut "écrit"', mkInput(co.statusTyping, '', v => co.statusTyping = v))
  ));

  const tlCard = el('div', 'card');
  tlCard.appendChild(el('div', 'card-head', 'Labels de confiance  (index 0 = −4 · index 4 = neutre · index 8 = +4)'));
  const offsets = [−4,−3,−2,−1,0,1,2,3,4];
  T.trustLabels.forEach((lbl, i) => {
    const o = offsets[i];
    const prefix = o < 0 ? `🔴 ${o}` : o > 0 ? `🟢 +${o}` : `⚪  0`;
    tlCard.appendChild(field(prefix, mkInput(lbl, '', v => T.trustLabels[i] = v)));
  });
  wrap.appendChild(tlCard);

  wrap.appendChild(card('Textes d\'interface',
    field('Confiance initiale', mkInput(T.trustInitial, '', v => T.trustInitial = v)),
    field('Hint choix normal', mkInput(T.choiceHint, '', v => T.choiceHint = v)),
    field('Hint choix crise', mkInput(T.choiceHintCrise, '', v => T.choiceHintCrise = v)),
    field('Bouton restart', mkInput(T.restartBtn, '', v => T.restartBtn = v)),
    field('En-tête révélations', mkInput(T.revelationsHeader, '', v => T.revelationsHeader = v))
  ));

  return wrap;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION: Ouverture
// ═══════════════════════════════════════════════════════════════════════════
function renderOuverture() {
  const wrap = el('div');
  wrap.appendChild(el('div', 'sec-title', 'Séquence d\'ouverture'));
  wrap.appendChild(card('Messages d\'ouverture', msgList(T.ouverture)));
  return wrap;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION: Scénario G
// ═══════════════════════════════════════════════════════════════════════════
function renderScenario() {
  const wrap = el('div');
  wrap.appendChild(el('div', 'sec-title', 'Scénario principal (G)'));

  T.G.forEach((step, i) => {
    const stepEl = el('div', 'step');
    const hd = el('div', 'step-hd');
    const num = el('span', 'step-num', `Étape ${i}`);
    const preview = step.intro && step.intro.length > 0
      ? step.intro[0].substring(0, 55) + (step.intro[0].length > 55 ? '…' : '')
      : (step.c && step.c.length ? `[${step.c.map(c => c.l).join(' / ')}]` : '-');
    const prev = el('span', 'step-preview', preview);
    const arrow = el('span', 'step-arrow', '▼');
    hd.appendChild(num);
    hd.appendChild(prev);
    hd.appendChild(arrow);
    stepEl.appendChild(hd);

    const body = el('div', 'step-body' + (i === 0 ? ' open' : ''));
    if (i === 0) arrow.textContent = '▲';

    if (Array.isArray(step.intro)) {
      body.appendChild(el('div', 'sub', 'Intro - messages d\'Inès avant les choix'));
      body.appendChild(introList(step.intro));
    } else {
      const noIntroMsg = el('div', 'sub', '(pas d\'intro)');
      noIntroMsg.style.color = '#475569';
      body.appendChild(noIntroMsg);
      body.appendChild(addBtn('+ Ajouter une intro pour cette étape', () => {
        step.intro = [''];
        showTab('scenario');
      }));
    }

    if (step.edu !== undefined) {
      const eduSub = el('div', 'sub', 'Réflexion du héros (pensée interne)');
      eduSub.style.marginTop = '12px';
      body.appendChild(eduSub);
      body.appendChild(mkTextarea(step.edu, '', v => step.edu = v));
    } else {
      body.appendChild(addBtn('+ Ajouter une réflexion du héros', () => {
        step.edu = '';
        showTab('scenario');
      }));
    }

    const choiceSub = el('div', 'sub', 'Choix');
    choiceSub.style.marginTop = '12px';
    body.appendChild(choiceSub);
    body.appendChild(choiceList(step.c));

    const rmvStep = el('button', 'rmv', `× Supprimer l'étape ${i}`);
    rmvStep.style.marginTop = '10px';
    rmvStep.style.width = '100%';
    rmvStep.type = 'button';
    rmvStep.addEventListener('click', () => { T.G.splice(i, 1); showTab('scenario'); });
    body.appendChild(rmvStep);

    stepEl.appendChild(body);
    hd.addEventListener('click', () => {
      body.classList.toggle('open');
      arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
    });

    wrap.appendChild(stepEl);
  });

  wrap.appendChild(addBtn('+ Ajouter une étape', () => {
    T.G.push({ intro: [''], c: [{ l: 'A', t: '', e: 1 }, { l: 'B', t: '', e: -1 }, { l: 'C', t: '', e: 0 }] });
    showTab('scenario');
  }));

  return wrap;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION: Crise
// ═══════════════════════════════════════════════════════════════════════════
function renderCrisis() {
  const wrap = el('div');
  wrap.appendChild(el('div', 'sec-title', 'Crise de confiance'));
  wrap.appendChild(card('Messages d\'intro (Inès devient méfiante)', introList(T.CRISIS.intro)));
  wrap.appendChild(card('Choix de réponse à la crise', choiceList(T.CRISIS.c)));
  return wrap;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION: Révélations
// ═══════════════════════════════════════════════════════════════════════════
function renderRevelations() {
  const wrap = el('div');
  wrap.appendChild(el('div', 'sec-title', 'Révélations - Ce que tu as appris'));

  const renderCards = () => {
    while (wrap.children.length > 1) wrap.removeChild(wrap.lastChild);
    T.REVELATIONS.forEach((rev, i) => {
      const c = el('div', 'card');
      c.appendChild(el('div', 'card-head', `Révélation ${i + 1}`));
      c.appendChild(field('Icône', mkInput(rev.icon, '', v => rev.icon = v)));
      c.appendChild(field('Titre', mkInput(rev.title, '', v => rev.title = v)));
      const txtA = mkTextarea(rev.txt, '', v => rev.txt = v);
      c.appendChild(field('Texte', txtA));
      const rm = el('button', 'rmv', `× Supprimer`);
      rm.type = 'button';
      rm.style.marginTop = '8px';
      rm.style.width = '100%';
      rm.addEventListener('click', () => { T.REVELATIONS.splice(i, 1); renderCards(); });
      c.appendChild(rm);
      wrap.appendChild(c);
    });
    wrap.appendChild(addBtn('+ Ajouter une révélation', () => {
      T.REVELATIONS.push({ icon: '❓', title: '', txt: '' });
      renderCards();
    }));
  };

  renderCards();
  return wrap;
}
