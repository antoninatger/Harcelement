<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrouver Clara</title>
<!--
  jeu.html - la coquille du jeu
  ---------------------------------------------------------------------------
  Le navigateur quitte le plein écran à chaque changement de page : c'est une
  règle de sécurité, impossible à contourner page par page. Toutes les pages
  du jeu s'affichent donc ici, dans un cadre qui occupe tout l'écran. Seul le
  cadre change de page ; la coquille, elle, reste en place, et c'est elle qui
  passe en plein écran. Le plein écran tient ainsi du menu jusqu'à la fin.

  Chaque page du jeu renvoie ici d'elle-même (voir coquille.js) : rien à
  changer dans l'iframe du site WordPress.
-->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#jeu{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
</style>
</head>
<body>
<iframe id="jeu" name="rc-coquille" title="Retrouver Clara" allow="fullscreen" allowfullscreen></iframe>
<script>
(function () {
  var cadre = document.getElementById('jeu');
  // Seulement une page du jeu, dans ce dossier.
  var p = '';
  try { p = new URLSearchParams(location.search).get('p') || ''; } catch (e) {}
  if (!/^[A-Za-z0-9_\-]+\.html([?#].*)?$/.test(p)) p = 'index.html';
  cadre.src = p;

  // L'adresse et le titre suivent la page affichée : un rechargement
  // reprend là où l'on était.
  cadre.addEventListener('load', function () {
    try {
      var d = cadre.contentDocument, l = cadre.contentWindow.location;
      if (d.title) document.title = d.title;
      document.documentElement.lang = d.documentElement.lang || 'fr';
      var page = (l.pathname.split('/').pop() || 'index.html') + l.search + l.hash;
      history.replaceState(null, '', 'jeu.html?p=' + encodeURIComponent(page));
    } catch (e) {}
  });
})();
</script>
</body>
</html>
